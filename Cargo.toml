[package]
name = "passwords-keeper"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/siarheisinelnikau/passwords-keeper"
description = "A local Windows password vault with KDBX encryption"
build = "build.rs"

[dependencies]
keepass = { path = "vendor/keepass", features = ["save_kdbx4"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
egui = "=0.33.3"
egui-winit = { version = "=0.33.3", default-features = false }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std", "raster_stats"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
bytemuck = "1"
zeroize = { version = "1.8", features = ["derive", "serde"] }
sha2 = "0.10"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tempfile = "3"
fs2 = "0.4"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
semver = "1"
rfd = { version = "0.15", default-features = false }
flate2 = "1"
base64 = "0.22"
xml-rs = "0.8.29"
subtle = "2.6"

[patch.crates-io]
aes = { path = "vendor/aes" }
hmac = { path = "vendor/hmac" }
salsa20 = { path = "vendor/salsa20" }
twofish = { path = "vendor/twofish" }
cbc = { path = "vendor/cbc" }
block-padding = { path = "vendor/block-padding" }
hex-literal = { path = "vendor/hex-literal" }
argon2 = { path = "vendor/argon2" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
incremental = false

[profile.dev.package.argon2]
opt-level = 2

[profile.dev.package.aes]
opt-level = 2

[profile.dev.package.egui_software_backend]
opt-level = 2
