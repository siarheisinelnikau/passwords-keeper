name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the v prefix
        required: true
        type: string
        default: '0.2.0'
      notes:
        description: Readable English release notes; use \n for line breaks
        required: true
        type: string
        default: "Passwords Keeper 0.2.0 is the first packaged public release of the local Windows password vault.\\n\\n### Added\\n- Create and open encrypted KDBX 4.0 vaults, organize entries into groups, search entries, and generate random passwords.\\n- Use a master password, a key file, or both. Read KeePass XML v1/v2 keys (including v2 checksum validation), 32-byte binary keys, 64-digit hexadecimal keys, and arbitrary key files up to 1 MiB. Create new XML v2 key files and change an existing vault's master key.\\n- Add, remove, and explicitly export encrypted attachments. Shared attachments and references in entry history are preserved. Limits: 8 MiB per file, 16 MiB total, 256 unique binaries. Exported copies are unencrypted.\\n- English, Russian, German, French, Spanish, and Italian interfaces; light and dark themes; configurable idle lock and owned-clipboard expiry.\\n- Manual and optional startup update checks, with a user-initiated download and installation flow.\\n\\n### Fixed\\n- Settings now have a stable Close button outside the scrolling content and close with Escape. Closing requests a frame update.\\n- KDBX attachment references are read and written instead of being discarded; unused binary data is removed without breaking shared or historical references.\\n\\n### Verification and limitations\\n- 35 synthetic tests passed, including external KeePass key-file fixtures, wrong-key handling, cancelled/conflicting key changes, attachment/history round trips, storage conflicts, and settings dismissal.\\n- Formatting, strict Clippy, and static packaged-EXE checks passed. The x64 Windows GUI executable embeds the product icon and does not require a separate Visual C++ runtime.\\n- The native application was not launched for this release. Native window/tray behavior, clipboard integration, idle/hidden performance, and update installation remain unverified interactively.\\n- Supports KDBX 4.0 with AES-256 or ChaCha20 and Argon2d/id 1.3 or AES-KDF. Hardware keys, KDB/KDBX 3, KDBX 4.1, and legacy XML binary pools are unsupported. Library writing remains experimental; keep independent backups. Existing backups retain their previous master key.\\n\\n### Download\\nWindows x64: `PasswordsKeeper-v0.2.0.exe`. Verify it using the accompanying `.sha256` file.\\n"

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version and release notes
        id: release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release version.' }
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success -or $match.Groups[1].Value -ne $version) { throw 'Version must match Cargo.toml.' }
          $notes = $env:RELEASE_NOTES.Replace('\n', "`n").Trim()
          if ($notes.Length -lt 80 -or $notes.Length -gt 50000) { throw 'Provide readable English release notes (80 to 50,000 characters).' }
          if ($notes -match '^Passwords Keeper ([0-9]+\.[0-9]+\.[0-9]+)\b' -and $Matches[1] -ne $version) { throw 'Release notes describe a different version.' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @{ version = $version; tag = "v$version"; commit = $env:GITHUB_SHA; body = $notes } |
            ConvertTo-Json | Set-Content -LiteralPath dist/release.json -Encoding utf8NoBOM
          "version=$version" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install the verified Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default 1.96.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not select Rust.' }
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run synthetic tests without launching the native app
        run: cargo test --locked --all-targets -- --test-threads 2
      - name: Build the portable executable and checksum
        shell: pwsh
        run: ./tools/package.ps1
      - name: Inspect the executable without running it
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed.' }
          python tools/verify_package.py "dist/PasswordsKeeper-v$env:RELEASE_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Executable verification failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-windows-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-windows-release
          path: verified-release
      - name: Publish the verified assets without changing previous releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const path = require('node:path');
            const directory = 'verified-release';
            const metadata = JSON.parse(fs.readFileSync(path.join(directory, 'release.json'), 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(metadata.version) || metadata.tag !== `v${metadata.version}` || metadata.commit !== context.sha) {
              throw new Error('Release metadata does not match this run.');
            }
            const executable = `PasswordsKeeper-v${metadata.version}.exe`;
            const data = fs.readFileSync(path.join(directory, executable));
            const checksumName = `${executable}.sha256`;
            const checksum = fs.readFileSync(path.join(directory, checksumName), 'utf8');
            const digest = crypto.createHash('sha256').update(data).digest('hex');
            if (checksum !== `${digest}  ${executable}\n` || data.length < 1024 || data.toString('ascii', 0, 2) !== 'MZ') {
              throw new Error('Release asset checksum or format is invalid.');
            }
            const repository = context.repo;
            try {
              await github.rest.git.getRef({ ...repository, ref: `tags/${metadata.tag}` });
              throw new Error('This version already has a tag. Previous releases will not be overwritten.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: release } = await github.rest.repos.createRelease({
              ...repository,
              tag_name: metadata.tag,
              target_commitish: context.sha,
              name: `Passwords Keeper ${metadata.version}`,
              body: metadata.body,
              draft: true,
              prerelease: false,
            });
            for (const [name, bytes, contentType] of [
              [executable, data, 'application/vnd.microsoft.portable-executable'],
              [checksumName, Buffer.from(checksum), 'text/plain'],
            ]) {
              const asset = await github.rest.repos.uploadReleaseAsset({
                ...repository,
                release_id: release.id,
                name,
                data: bytes,
                headers: { 'content-type': contentType, 'content-length': bytes.length },
              });
              const expected = crypto.createHash('sha256').update(bytes).digest('hex');
              if (asset.data.size !== bytes.length || asset.data.digest !== `sha256:${expected}`) {
                throw new Error('GitHub did not confirm the uploaded asset integrity. The release remains a draft.');
              }
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...repository, release_id: release.id, draft: false, make_latest: 'true',
            });
            await core.summary.addHeading('Published Windows release')
              .addLink(published.name, published.html_url)
              .addRaw(`\n\nSHA-256: ${digest}\n`).write();
